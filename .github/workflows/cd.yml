name: CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-demo:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-demo:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy and smoke test
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/flask-demo:${{ github.sha }}
          docker run -d -p 5000:5000 --name web ${{ secrets.DOCKERHUB_USERNAME }}/flask-demo:${{ github.sha }}
          sleep 5
          curl -f http://localhost:5000
